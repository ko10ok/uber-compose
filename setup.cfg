[isort]
line_length = 120
force_single_line = True
force_sort_within_sections = True
known_first_party = uber_compose
skip = .venv,.git,build,dist,tests/mnt,tests/.vedro,tests/deps,tests/up,tests/build
skip_glob = **/__pycache__/*,**/*.egg-info/*

[flake8]
max-line-length = 120
exclude =
    .venv,
    .git,
    build,
    dist,
    *.egg-info,
    tests/mnt,
    tests/.vedro,
    tests/deps,
    tests/up,
    tests/build,
    __pycache__
# E203/W503 conflict with common formatter output (slicing / line breaks before binary operators);
# E731 forbids assigning lambdas to names, which this project intentionally uses in a few places.
extend-ignore = E203,W503,E731,E711
